<!DOCTYPE html>

<title>Domain Expansion: Jujutsu Trials</title>
<style>
body{margin:0;background:#000;font-family:system-ui,Arial,sans-serif}
#domain-menu{position:fixed;inset:0;z-index:10000;display:none;align-items:center;justify-content:center;padding:20px;box-sizing:border-box;background:radial-gradient(ellipse at center,#17172a 0%,#050509 72%);color:#fff;text-align:center}
#domain-menu .panel{width:min(760px,100%);padding:26px 22px;border:1px solid #69698d;border-radius:20px;background:rgba(8,8,18,.94);box-shadow:0 0 38px #33336a}

#domain-menu button strong{display:block;font-size:18px;margin-bottom:5px}#domain-menu button span{display:block;color:#d2d2e6;font-size:13px;line-height:1.4}
#domain-menu .hint{font-size:12px;color:#9999b5;margin-top:18px}
#domain-menu .status{font-size:14px;color:#b8ffd0;margin-top:12px;min-height:20px}
.webxr-button:disabled{opacity:.35!important;pointer-events:none!important}

<body>
<div id="domain-menu" role="dialog" aria-modal="true" aria-labelledby="menu-title">
  <div class="panel">
    <h1 id="menu-title">Choose Your Domain</h1>
    <p>Choose one Domain Expansion for this run. You can only use the domain you select.</p>
    <div class="choices">
      <button data-domain="void"><strong>Unlimited Void</strong><span>Overwhelms and immobilizes curses while dealing heavy continuous damage.</span></button>
      <button data-domain="shrine"><strong>Malevolent Shrine</strong><span>Highest sustained slashing damage; devastating against groups.</span></button>
      <button data-domain="coffin"><strong>Coffin of the Iron Mountain</strong><span>Volcanic domain with powerful continuous heat damage.</span></button>
      <button data-domain="shadow"><strong>Chimera Shadow Garden</strong><span>Shadow pressure plus a major boost to all shikigami damage.</span></button>
    </div>
    <div class="hint">Enter VR, choose a domain in-headset, and choose again after each defeat.</div><div class="status" id="menu-status">Select a domain to unlock VR.</div>
  </div>
</div>

function showErr(m){document.body.insertAdjacentHTML('beforeend','<pre style="position:fixed;top:0;left:0;right:0;z-index:99;margin:0;color:#f55;background:#000;font-size:18px;white-space:pre-wrap;padding:10px">'+m+'</pre>')}
addEventListener('error',e=>showErr((e.message||'error')+' @ line '+e.lineno));
addEventListener('unhandledrejection',e=>showErr('Promise error: '+e.reason));
</script>
<script type="module">
import * as THREE from 'three';
import { VRButton } from 'three/addons/webxr/VRButton.js';
import { XRHandModelFactory } from 'three/addons/webxr/XRHandModelFactory.js';

/* ============ TUNING ============ */
const SFX = true, VOL = 0.8, DEBUG = true, KANJI = true, RES = 1.0;
const EXT = 0.85, CURL = 0.72, RAISE = 0.55, CROSS = 0.032;
const SHRINE_D = 0.44, COFFIN_D = 0.38, COFFIN_T = 0.12, SHADOW_D = 0.32, GRACE = 260;
// Domain signs require a deliberate, stable mudra; short tracking flickers won't activate them.
const HOLD = { void: 720, shrine: 780, coffin: 760, shadow: 760, normal: 650, dogs: 600, nue: 650, toad: 620, mahoraga: 850, blue: 550, red: 650, purple: 850, dismantle: 500, cleave: 600, firearrow: 800 };
const COST = { dogs: 18, nue: 24, toad: 22, mahoraga: 62, blue: 14, red: 20, purple: 38, dismantle: 10, cleave: 16, firearrow: 30 };
const SUMMON_COOLDOWN = { dogs: 8, nue: 10, toad: 9, mahoraga: 24, blue: 3, red: 5, purple: 12, dismantle: 2, cleave: 3, firearrow: 9 };
const DOMAIN_COOLDOWN = 14, RCT_COOLDOWN = 5, PUNCH_COOLDOWN = 0.65;
const DOMAIN_COST = { void: 40, shrine: 44, coffin: 35, shadow: 40 };
const CE_MAX = 100, CE_REGEN = 2.8, DOMAIN_DRAIN = 7.5, RCT_DRAIN = 18, RCT_HEAL = 7, DOMAIN_LOCKOUT = 14;
let chosenDomain = null, gameStarted = false, awaitingDomainPick = true;
const domainMenu = document.getElementById('domain-menu');
const menuStatus = document.getElementById('menu-status');
let vrButton = null;
// Domain selection is deliberately an in-headset menu. The desktop DOM menu is hidden.
domainMenu.style.display = 'none';
function showDomainMenu(message = 'Choose your domain') {
  awaitingDomainPick = true; gameStarted = false;
  if (vrDomainGroup) vrDomainGroup.visible = true;
  vrMenuMessage = message;
  drawVrDomainMenu();
}
function hideDomainMenu() { if (vrDomainGroup) vrDomainGroup.visible = false; }
function chooseDomainInVR(name) {
  if (!awaitingDomainPick || !renderer.xr.isPresenting) return;
  chosenDomain = name; awaitingDomainPick = false; hideDomainMenu();
  Object.assign(G, { hp: 100, ce: CE_MAX, wave: 0, score: 0, nextWave: 1.5, adapt: [0,0,0], combo: 0, comboT: 0 });
  curses.length = 0; shiki.length = 0; fxs.length = 0; pending = null;
  if (envName !== 'normal') swapTo('normal');
  gameStarted = true; G.nextWave = 1.5;
  say('Chosen domain: ' + INFO[chosenDomain].en + ' — survive the curses');
}

/* ============ SIGNS ============
 Anime-inspired hand-sign recognition (hold steadily; two-hand signs take longer):
   single raised thumbs-up = Unlimited Void | raised open palm = leave domain
   raised index = Divine Dogs | raised peace sign = Nue | raised three-finger sign = Max Toad
   two raised peace signs held close = Malevolent Shrine | two open palms held side-by-side = Coffin of the Iron Mountain
   two fists held together = Chimera Shadow Garden | two three-finger signs together = Mahoraga
   Signs are gesture approximations based on tracked finger joints; hold times and release debounce reduce false activations.
 Fist punch fast at a curse = hit (chain hits for Black Flash)
 Both fists with thumbs extended upward, held together = Reverse Cursed Technique (heal)
 Desktop test keys: 1-4 shikigami, V/S/C/H domains, N normal, Space = punch */

/* ---------- Renderer / scene ---------- */
const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(70, innerWidth / innerHeight, 0.01, 200);
camera.position.set(0, 1.6, 0); scene.add(camera);
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setSize(innerWidth, innerHeight);
renderer.xr.enabled = true; renderer.xr.setFramebufferScaleFactor(RES); renderer.xr.setFoveation(1);
document.body.appendChild(renderer.domElement);
vrButton = VRButton.createButton(renderer); vrButton.disabled = false; document.body.appendChild(vrButton);
renderer.xr.addEventListener('sessionstart', () => {
  gameStarted = false; chosenDomain = null;
  Object.assign(G, { hp: 100, ce: CE_MAX, wave: 0, score: 0, nextWave: 1.5, adapt: [0,0,0], combo: 0, comboT: 0 });
  showDomainMenu('SELECT DOMAIN TO START');
});
renderer.xr.addEventListener('sessionend', () => { gameStarted = false; awaitingDomainPick = true; hideDomainMenu(); });

// Floating in-VR domain picker: aim a controller at a card and press its trigger.
// In-VR instruction only: select the domain by holding its hand sign.
let vrMenuMessage = 'SELECT DOMAIN TO START';
const vrDomainGroup = new THREE.Group(); vrDomainGroup.name = 'InVRDomainInstruction';
vrDomainGroup.position.set(0, 0, -1.9); camera.add(vrDomainGroup); vrDomainGroup.visible = false;
function makeInstructionTexture(message) {
  const c = document.createElement('canvas'); c.width = 1024; c.height = 420;
  const x = c.getContext('2d');
  x.fillStyle = 'rgba(7,9,19,.94)'; x.fillRect(0,0,c.width,c.height);
  x.strokeStyle = '#a5b4fc'; x.lineWidth = 8; x.strokeRect(5,5,c.width-10,c.height-10);
  x.textAlign = 'center'; x.fillStyle = '#fff'; x.font = 'bold 54px sans-serif';
  const lines = message.split('\n');
  lines.forEach((line,i) => { x.fillText(line,512,100+i*68); });
  x.fillStyle = '#cdd5f7'; x.font = '30px sans-serif';
  x.fillText('Unlimited Void: one raised thumbs-up',512,270);
  x.fillText('Malevolent Shrine: two peace signs together',512,315);
  x.fillText('Iron Mountain: hold both open palms side-by-side',512,360);
  x.fillText('Shadow Garden: two fists together',512,405);
  const t = new THREE.CanvasTexture(c); t.colorSpace = THREE.SRGBColorSpace; return t;
}
const vrInstruction = new THREE.Mesh(
  new THREE.PlaneGeometry(1.65, .68),
  new THREE.MeshBasicMaterial({map:makeInstructionTexture('SELECT DOMAIN TO START\nHold the domain sign until it locks in'), transparent:true, depthTest:true, depthWrite:false, side:THREE.DoubleSide})
);
vrInstruction.position.set(0,0,0); vrDomainGroup.add(vrInstruction);
function drawVrDomainMenu() {
  vrInstruction.material.map.dispose();
  vrInstruction.material.map = makeInstructionTexture(vrMenuMessage + '\nHold the domain sign until it locks in');
  vrInstruction.material.needsUpdate = true;
}
const sun = new THREE.DirectionalLight(0xffffff, 1); sun.position.set(2, 5, 2); scene.add(sun);
const amb = new THREE.AmbientLight(0xffffff, 0.6); scene.add(amb);
const pt = new THREE.PointLight(0xffffff, 0); scene.add(pt);
scene.fog = new THREE.FogExp2(0xffffff, 0);

/* ---------- Helpers ---------- */
const rand = (a, b) => a + Math.random() * (b - a);
const ease = x => 1 - Math.pow(1 - Math.min(1, Math.max(0, x)), 3);
const UP = new THREE.Vector3(0, 1, 0), ZAX = new THREE.Vector3(0, 0, 1), TIME = { value: 0 };
const std = (c, o = {}) => new THREE.MeshStandardMaterial({ color: c, roughness: .85, metalness: .05, ...o });
const basic = (c, o = {}) => new THREE.MeshBasicMaterial({ color: c, ...o });
const glow = (c, op = 1) => new THREE.MeshBasicMaterial({ color: c, transparent: true, opacity: op, blending: THREE.AdditiveBlending, depthWrite: false });
const raw = h => new THREE.Vector3((h >> 16 & 255) / 255, (h >> 8 & 255) / 255, (h & 255) / 255);
const mesh = (g, m, x = 0, y = 0, z = 0) => { const o = new THREE.Mesh(g, m); o.position.set(x, y, z); return o; };

/* ---------- Sound (all generated, no files) ---------- */
const A = (() => {
  let c, m, nb, amb2 = null, cur = 'normal';
  const ok = () => c && c.state === 'running';
  const DR = { normal: 0, void: [55, 'sine'], shrine: [41, 'sawtooth'], coffin: [45, 'sine'], shadow: [98, 'sine'] };
  function init() {
    if (!SFX) return;
    if (c) { c.resume().catch(() => {}); return; }
    const AC = window.AudioContext || window.webkitAudioContext; if (!AC) return;
    c = new AC(); m = c.createGain(); m.gain.value = VOL; m.connect(c.destination);
    nb = c.createBuffer(1, c.sampleRate, c.sampleRate);
    const d = nb.getChannelData(0); for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
    c.resume().catch(() => {}); setAmb(cur);
  }
  function tone(f, type, dur, vol, f2) {
    if (!ok()) return;
    const t = c.currentTime, o = c.createOscillator(), g = c.createGain();
    o.type = type; o.frequency.setValueAtTime(f, t);
    if (f2) o.frequency.exponentialRampToValueAtTime(f2, t + dur);
    g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(.0001, t + dur);
    o.connect(g); g.connect(m); o.start(t); o.stop(t + dur + .05);
  }
  function noise(dur, vol, f1, f2, type = 'lowpass') {
    if (!ok()) return;
    const t = c.currentTime, s = c.createBufferSource(), f = c.createBiquadFilter(), g = c.createGain();
    s.buffer = nb; s.loop = true; f.type = type;
    f.frequency.setValueAtTime(f1, t); f.frequency.exponentialRampToValueAtTime(f2, t + dur);
    g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(.0001, t + dur);
    s.connect(f); f.connect(g); g.connect(m); s.start(t); s.stop(t + dur + .05);
  }
  function setAmb(n) {
    cur = n; if (!c) return;
    if (amb2) { amb2.g.gain.setTargetAtTime(0, c.currentTime, .4); const o = amb2.o; setTimeout(() => { try { o.stop(); } catch (e) {} }, 2500); amb2 = null; }
    const d = DR[n]; if (!d) return;
    const o = c.createOscillator(), g = c.createGain();
    o.type = d[1]; o.frequency.value = d[0]; g.gain.value = 0; g.gain.setTargetAtTime(.12, c.currentTime, .6);
    o.connect(g); g.connect(m); o.start(); amb2 = { o, g };
  }
  const riser = () => { noise(.28, .35, 300, 5000, 'highpass'); tone(180, 'triangle', .28, .12, 900); };
  const impact = n => {
    const f = { void: 70, shrine: 55, coffin: 50, shadow: 110 }[n];
    if (f) { tone(f, 'sine', 2.5, .9, f / 2.5); noise(2, .5, 2000, 100); }
    else for (let i = 0; i < 10; i++) tone(rand(2500, 6500), 'triangle', rand(.1, .3), .05);
  };
  return { init, ok, setAmb, tone, noise, riser, impact };
})();
['pointerdown', 'click', 'touchstart', 'keydown'].forEach(ev => addEventListener(ev, A.init, true));
renderer.xr.addEventListener('sessionstart', A.init);
[0, 1].forEach(i => { const c = renderer.xr.getController(i); c.addEventListener('selectstart', () => A.init()); scene.add(c); });

/* ---------- Shaders ---------- */
const GLSL = `
float h2(vec2 p){return fract(sin(dot(p,vec2(127.1,311.7)))*43758.5453);}
float n2(vec2 p){vec2 i=floor(p);vec2 f=fract(p);f=f*f*(3.0-2.0*f);return mix(mix(h2(i),h2(i+vec2(1.0,0.0)),f.x),mix(h2(i+vec2(0.0,1.0)),h2(i+vec2(1.0,1.0)),f.x),f.y);}
float fbm2(vec2 p){float v=0.0;float a=0.5;for(int k=0;k<3;k++){v+=a*n2(p);p=p*2.03+vec2(11.7,3.1);a*=0.5;}return v/0.875;}
float h3(vec3 p){p=fract(p*0.3183099+vec3(0.1));p*=17.0;return fract(p.x*p.y*p.z*(p.x+p.y+p.z));}
float n3(vec3 x){vec3 i=floor(x);vec3 f=fract(x);f=f*f*(3.0-2.0*f);
return mix(mix(mix(h3(i),h3(i+vec3(1.0,0.0,0.0)),f.x),mix(h3(i+vec3(0.0,1.0,0.0)),h3(i+vec3(1.0,1.0,0.0)),f.x),f.y),
mix(mix(h3(i+vec3(0.0,0.0,1.0)),h3(i+vec3(1.0,0.0,1.0)),f.x),mix(h3(i+vec3(0.0,1.0,1.0)),h3(i+vec3(1.0,1.0,1.0)),f.x),f.y),f.z);}
float fbm3(vec3 p){float v=0.0;float a=0.5;for(int k=0;k<3;k++){v+=a*n3(p);p=p*2.02+vec3(5.2,1.3,7.7);a*=0.5;}return v/0.875;}
`;
const SKY_V = `varying vec3 vDir;void main(){vDir=position;gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.0);}`;
const GRD_V = `varying vec3 vW;void main(){vec4 w=modelMatrix*vec4(position,1.0);vW=w.xyz;gl_Position=projectionMatrix*viewMatrix*w;}`;
function dome(frag, u = {}, r = 80) {
  const o = new THREE.Mesh(new THREE.SphereGeometry(r, 32, 24), new THREE.ShaderMaterial({ side: THREE.BackSide, depthWrite: false, uniforms: { uTime: TIME, ...u }, vertexShader: SKY_V, fragmentShader: GLSL + frag }));
  o.renderOrder = -10; o.frustumCulled = false; return o;
}
const sky = (top, bot) => dome(`uniform vec3 uTop;uniform vec3 uBot;varying vec3 vDir;void main(){float t=pow(clamp(normalize(vDir).y,0.0,1.0),0.6);gl_FragColor=vec4(mix(uBot,uTop,t),1.0);}`, { uTop: { value: raw(top) }, uBot: { value: raw(bot) } });
function ground(frag, u = {}, y = 0) {
  const g = new THREE.Mesh(new THREE.CircleGeometry(75, 64), new THREE.ShaderMaterial({ uniforms: { uTime: TIME, ...u }, vertexShader: GRD_V, fragmentShader: GLSL + frag }));
  g.rotation.x = -Math.PI / 2; g.position.y = y; return g;
}
function particles(n, color, size, range, h, speed, add = true) {
  const p = new Float32Array(n * 3);
  for (let i = 0; i < n; i++) { p[i * 3] = rand(-range, range); p[i * 3 + 1] = rand(0, h); p[i * 3 + 2] = rand(-range, range); }
  const geo = new THREE.BufferGeometry(); geo.setAttribute('position', new THREE.BufferAttribute(p, 3));
  const o = new THREE.Points(geo, new THREE.PointsMaterial({ color, size, transparent: true, depthWrite: false, blending: add ? THREE.AdditiveBlending : THREE.NormalBlending }));
  o.frustumCulled = false;
  o.userData.step = dt => { const a = geo.attributes.position; for (let i = 0; i < n; i++) { let y = a.getY(i) - speed * dt; if (y < 0) y += h; else if (y > h) y -= h; a.setY(i, y); } a.needsUpdate = true; };
  return o;
}

/* ================= DOMAINS ================= */
function buildNormal() {
  const g = new THREE.Group(); g.add(sky(0x3d8fe0, 0xcfe8ff));
  const gr = mesh(new THREE.CircleGeometry(75, 48), std(0x3a7d44)); gr.rotation.x = -Math.PI / 2; g.add(gr);
  const tm = std(0x6b4a2b), lm = std(0x2e6b3a);
  for (let i = 0; i < 20; i++) { const a = rand(0, 6.283), r = rand(5, 30), x = Math.cos(a) * r, z = Math.sin(a) * r;
    g.add(mesh(new THREE.CylinderGeometry(.15, .2, 1.2, 6), tm, x, .6, z)); g.add(mesh(new THREE.ConeGeometry(.9, 2.6, 8), lm, x, 2.3, z)); }
  return { group: g, bg: 0xcfe8ff, fog: [0xcfe8ff, .006], sun: [0xffffff, 1.2], amb: [0xffffff, .7], pt: [0xffffff, 0], update() {} };
}

function buildVoid() {   // Gojo: Unlimited Void
  const g = new THREE.Group();
  g.add(dome(`varying vec3 vDir;uniform float uTime;void main(){vec3 d=normalize(vDir);float t=uTime*.02;vec3 q=d*2.2+vec3(t,t*.6,-t);float a=fbm3(q),b=fbm3(q*2.3+7.);
    vec3 c=vec3(.2,.05,.45)*smoothstep(.45,.9,a)+vec3(0.,.38,.6)*smoothstep(.55,.95,b)*.9+vec3(.8,.15,.6)*pow(smoothstep(.35,.85,a*b*1.8),2.);
    vec3 sp=d*90.;float s=h3(floor(sp));float st=smoothstep(.975,1.,s)*(1.-smoothstep(0.,.55,length(fract(sp)-.5)));st*=.6+.4*sin(uTime*3.+s*60.);
    c+=vec3(st)*1.6;gl_FragColor=vec4(c,1.);}`));
  const rings = [[2.2, 0xffffff], [3.6, 0x6fe3ff]].map(([r, c]) => { const o = mesh(new THREE.RingGeometry(r, r + .05, 96), glow(c, .8), 0, .01, 0); o.rotation.x = -Math.PI / 2; g.add(o); return o; });
  const halos = [[5, 0xffffff], [7.5, 0x6fe3ff], [10, 0xff7ad9]].map(([r, c]) => { const o = mesh(new THREE.TorusGeometry(r, .015, 6, 160), glow(c, .7), 0, 1.6, 0); g.add(o); return o; });
  const pal = [0x66e0ff, 0xff66cc, 0xffffff, 0x9a7bff, 0x4dffd2].map(c => new THREE.Color(c)), S = 160, data = [], dm = new THREE.Object3D();
  const st = new THREE.InstancedMesh(new THREE.BoxGeometry(1, 1, 1), new THREE.MeshBasicMaterial({ transparent: true, opacity: .85, blending: THREE.AdditiveBlending, depthWrite: false }), S);
  st.frustumCulled = false;
  const resp = s => { s.p = new THREE.Vector3(rand(-1, 1), rand(-.6, 1), rand(-1, 1)).normalize().multiplyScalar(rand(24, 32));
    s.d = new THREE.Vector3(rand(-5, 5), rand(0, 4), rand(-5, 5)).sub(s.p).normalize(); s.v = rand(8, 26); s.len = rand(1.5, 7); s.w = rand(.01, .02);
    s.q = new THREE.Quaternion().setFromUnitVectors(ZAX, s.d); };
  for (let i = 0; i < S; i++) { const s = {}; resp(s); s.p.addScaledVector(s.d, rand(0, 50)); data.push(s); st.setColorAt(i, pal[i % 5]); }
  g.add(st);
  return { group: g, bg: 0, fog: [0, 0], sun: [0x8899ff, .1], amb: [0xffffff, .3], pt: [0xffffff, 0],
    update(t, dt) {
      for (let i = 0; i < S; i++) { const s = data[i]; s.p.addScaledVector(s.d, s.v * dt); if (s.p.length() > 34 && s.p.dot(s.d) > 0) resp(s);
        dm.position.copy(s.p); dm.quaternion.copy(s.q); dm.scale.set(s.w, s.w, s.len); dm.updateMatrix(); st.setMatrixAt(i, dm.matrix); }
      st.instanceMatrix.needsUpdate = true;
      halos.forEach((h, i) => { h.rotation.x = t * .12 * (i + 1) * (i % 2 ? -1 : 1); h.rotation.y = t * .08 * (i + 1); });
      rings.forEach((r, i) => r.material.opacity = .5 + .4 * Math.sin(t * (2 - i * .7) + i));
    } };
}

function buildShrine() {   // Sukuna: Malevolent Shrine
  const g = new THREE.Group(); g.add(sky(0x080103, 0x4a080b));
  g.add(ground(`uniform float uTime;uniform vec3 uFog;varying vec3 vW;void main(){vec2 p=vW.xz;float w=fbm2(p*.3+vec2(uTime*.04,-uTime*.03));
    vec3 c=mix(vec3(.1,.005,.015),vec3(.42,.03,.05),w);c+=vec3(.45,.06,.05)*pow(n2(p*1.8+uTime*.25),7.);c=mix(c,uFog,smoothstep(8.,60.,length(vW-cameraPosition)));gl_FragColor=vec4(c,1.);}`, { uFog: { value: raw(0x4a080b) } }));
  const blk = std(0x140508, { roughness: .5, metalness: .25 }), lac = std(0x7a0c10, { emissive: 0x260304 }), bone = std(0xe6dcc4, { emissive: 0x2b2417 }), roofM = std(0x1b0709, { metalness: .35 });
  const sh = new THREE.Group(); sh.position.set(0, 0, -16); g.add(sh);
