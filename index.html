<style>
body{margin:0;background:#000;font-family:system-ui,Arial,sans-serif}

function updateTechniqueActors(dt){

    else if(a.kind==='cleave'||a.kind==='playfulcloud'){g.position.copy(a.start);g.rotation.z+=(a.kind==='cleave'?1:-1)*dt*17;g.rotation.y+=dt*4;g.scale.setScalar(.55+Math.sin(k*Math.PI)*.75);}

      if(a.kind==='red'&&k>=.16)g.scale.setScalar(1+Math.sin(a.t*28)*.08);

      if (chosenDomain === 'void' && inf.pose === 'thumbsup' && !(a && b && a.pose === 'thumbsup' && b.pose === 'thumbsup' && wd < .62)) s = 'void';
      else if (inf.pose === 'open' && !(bothUp && wd < .6)) s = 'normal';
      else if (inf.pose === 'point') s = chosenDomain === 'hakari' ? 'playfulcloud' : chosenDomain === 'todo' ? 'playfulcloud' : (chosenDomain === 'shrine' || chosenDomain === 'sukuna') ? 'dismantle' : chosenDomain === 'void' ? 'blue' : chosenDomain === 'shadow' ? 'dogs' : chosenDomain === 'coffin' ? 'embers' : null;
      else if (inf.pose === 'peace' && !voidGestureActive) s = chosenDomain === 'hakari' ? 'blue' : (chosenDomain === 'shrine' || chosenDomain === 'sukuna') ? 'cleave' : chosenDomain === 'void' ? 'red' : chosenDomain === 'shadow' ? 'nue' : chosenDomain === 'coffin' ? 'flameburst' : null;
      else if (inf.pose === 'three') s = chosenDomain === 'hakari' ? 'red' : (chosenDomain === 'shrine' || chosenDomain === 'sukuna') ? 'firearrow' : chosenDomain === 'void' ? 'purple' : chosenDomain === 'shadow' ? 'toad' : chosenDomain === 'coffin' ? 'meteor' : null;
    }
    update(hi, s, time);
  }
  if (gameStarted) gameStep(dt, info, wd);
  hudT -= dt; if (hudT <= 0) { hudT = .1; drawHud('L: ' + desc(a) + '  R: ' + desc(b)); }

  if (pending) {
    pending.t += dt;
    if (pending.phase === 0) { flashMat.opacity = Math.min(1, pending.t / .2); if (pending.t >= .2) { swapTo(pending.name); pending.phase = 1; pending.t = 0; } }
    else { flashMat.opacity = Math.max(0, 1 - pending.t); if (pending.t >= 1) { pending = null; flash.visible = false; flashMat.opacity = 0; } }
  }
  if (titleT < 4) { titleT += dt; titleMat.opacity = Math.min(1, titleT / .4) * Math.min(1, Math.max(0, (3.4 - titleT) / .8)); if (titleT >= 4) titleSpr.visible = false; }
  if(bossTitleT<5){bossTitleT+=dt;bossTitleMat.opacity=Math.min(1,bossTitleT/.8)*Math.min(1,Math.max(0,(4.6-bossTitleT)/1));if(bossTitleT>=5)bossTitleSpr.visible=false;}
  updateCastingMotions(dt);
  for(const h of hands){if(!h.userData.jjtStyled&&h.userData.jjtHandModel){let found=false;h.userData.jjtHandModel.traverse?.(o=>{if(o.isMesh&&o.material){found=true;const mats=Array.isArray(o.material)?o.material:[o.material];for(const m of mats){if(m.color)m.color.set(0xc5b7ad);if('roughness' in m)m.roughness=.72;if('metalness' in m)m.metalness=.02;m.needsUpdate=true;}}});if(found)h.userData.jjtStyled=true;}}
  envNow.update(TIME.value, dt, envAge); envAge += dt;
  renderer.render(scene, camera);
});
addEventListener('resize', () => { camera.aspect = innerWidth / innerHeight; camera.updateProjectionMatrix(); renderer.setSize(innerWidth, innerHeight); });
</script>
